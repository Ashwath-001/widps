# WIDPS Advanced Honeypot AP Configuration
# ============================================
# Multi-SSID deception network on a single interface using virtual BSSIDs.
#
# Prerequisites:
#   - AP-capable WiFi adapter (RT5370, MT7612U, or similar)
#   - hostapd 2.10+ with multi-BSS support
#   - sudo apt install hostapd dnsmasq
#
# Usage:
#   sudo hostapd honeypot/hostapd.conf -B -f /tmp/widps_honeypot_hostapd.log

# ---------------------------------------------------------------------------
# Primary Interface — "FreeWiFi" (opportunistic attacker lure)
# ---------------------------------------------------------------------------
interface=wlan2
driver=nl80211
ssid=FreeWiFi
channel=6
hw_mode=g

# No encryption — open network
auth_algs=1
wpa=0

# Beacon interval
beacon_int=100
dtim_period=2

# Max stations per BSS
max_num_sta=10

# Country code
country_code=IN

# 802.11n (makes it look like a real modern AP)
ieee80211n=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

# Logging — verbose for forensics
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Station event tracking (for connection/disconnection detection)
# These get written to the log file for our monitor to parse
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# ---------------------------------------------------------------------------
# Virtual BSS 1 — "eduroam_guest" (targeted attacker lure)
# ---------------------------------------------------------------------------
bss=wlan2_1
ssid=eduroam_guest
auth_algs=1
wpa=0
max_num_sta=10

# ---------------------------------------------------------------------------
# Virtual BSS 2 — "HP-Print-Setup" (IoT exploiter lure)
# ---------------------------------------------------------------------------
bss=wlan2_2
ssid=HP-Print-Setup
auth_algs=1
wpa=0
max_num_sta=5

# ---------------------------------------------------------------------------
# Virtual BSS 3 — "DIRECT-wifi" (automated scanner lure)
# ---------------------------------------------------------------------------
bss=wlan2_3
ssid=DIRECT-wifi
auth_algs=1
wpa=0
max_num_sta=5
