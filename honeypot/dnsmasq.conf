# WIDPS Honeypot DHCP/DNS — Intelligence Gathering Configuration
# ================================================================
# Provides DHCP and DNS to honeypot clients.
# ALL traffic is logged for forensic analysis.
# DNS responses are crafted to encourage further interaction.

# ---------------------------------------------------------------------------
# Interfaces — serve all honeypot virtual BSSes
# ---------------------------------------------------------------------------
interface=wlan2
interface=wlan2_1
interface=wlan2_2
interface=wlan2_3

# Bind only to honeypot interfaces (don't interfere with real network)
bind-interfaces
except-interface=lo
except-interface=eth0
except-interface=wlan0
except-interface=wlan1
except-interface=wlan1mon

# ---------------------------------------------------------------------------
# DHCP Configuration (isolated subnet per honeypot)
# ---------------------------------------------------------------------------
# Primary: FreeWiFi
dhcp-range=interface:wlan2,192.168.66.10,192.168.66.50,255.255.255.0,1h
dhcp-option=interface:wlan2,3,192.168.66.1
dhcp-option=interface:wlan2,6,192.168.66.1

# Virtual 1: eduroam_guest
dhcp-range=interface:wlan2_1,192.168.67.10,192.168.67.50,255.255.255.0,1h
dhcp-option=interface:wlan2_1,3,192.168.67.1
dhcp-option=interface:wlan2_1,6,192.168.67.1

# Virtual 2: HP-Print-Setup
dhcp-range=interface:wlan2_2,192.168.68.10,192.168.68.30,255.255.255.0,1h
dhcp-option=interface:wlan2_2,3,192.168.68.1
dhcp-option=interface:wlan2_2,6,192.168.68.1

# Virtual 3: DIRECT-wifi
dhcp-range=interface:wlan2_3,192.168.69.10,192.168.69.30,255.255.255.0,1h
dhcp-option=interface:wlan2_3,3,192.168.69.1
dhcp-option=interface:wlan2_3,6,192.168.69.1

# ---------------------------------------------------------------------------
# DNS Configuration — Intelligence Gathering
# ---------------------------------------------------------------------------

# Log ALL DNS queries (primary intelligence source)
log-queries
log-dhcp
log-facility=/var/log/widps_honeypot_dns.log

# Don't forward to real DNS — respond ourselves
no-resolv

# Captive portal detection: respond to connectivity checks
# This tricks devices into showing "Connected" but routes all traffic to us
address=/connectivitycheck.gstatic.com/192.168.66.1
address=/clients3.google.com/192.168.66.1
address=/captive.apple.com/192.168.66.1
address=/www.apple.com/192.168.66.1
address=/www.msftconnecttest.com/192.168.66.1
address=/www.msftncsi.com/192.168.66.1
address=/nmcheck.gnome.org/192.168.66.1
address=/network-test.debian.org/192.168.66.1

# Respond to common domains (makes attacker think they have internet)
# Redirects all HTTP to our captive portal for credential harvesting intelligence
address=/#/192.168.66.1

# ---------------------------------------------------------------------------
# DHCP Fingerprinting — capture vendor class IDs
# ---------------------------------------------------------------------------
# Log vendor class (helps identify OS)
dhcp-option=vendor:MSFT,1,0x01
dhcp-option=vendor:MSFT,43,0x01

# Lease file — we monitor this for new connections
dhcp-leasefile=/tmp/widps_honeypot_leases

# Short lease time (forces more DHCP interactions = more fingerprint data)
dhcp-lease-max=50

# ---------------------------------------------------------------------------
# mDNS/NBNS passive listening (device name leakage)
# ---------------------------------------------------------------------------
# Don't respond to mDNS but let it through for passive capture
# (captured by the main monitor interface in pcap)
