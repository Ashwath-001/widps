# ==============================================================================
# WIDPS Production Nginx Configuration
# ==============================================================================
#
# Full-scale reverse proxy for Raspberry Pi 5 deployment.
# Handles: static frontend, API proxy, SSE streaming, security hardening,
# rate limiting, logging, and connection management.
#
# Architecture:
#   Client :80 → nginx → static files (React SPA)
#                       → /api/* proxy → 127.0.0.1:8787 (Rust backend)
#
# Install:
#   sudo apt install nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/widps
#   sudo ln -sf /etc/nginx/sites-available/widps /etc/nginx/sites-enabled/widps
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

# Backend upstream with keepalive connections
upstream widps_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Frontend static files
    root /opt/widps/dashboard;
    index index.html;

    # Logging
    access_log /var/log/nginx/widps_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/widps_error.log warn;

    # Connection limits
    client_max_body_size 16K;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # --------------------------------------------------------------------------
    # SSE Streaming endpoint - special handling (long-lived connections)
    # --------------------------------------------------------------------------
    location = /api/stream {
        limit_conn sse_conn 5;      # Max 5 SSE connections per IP

        proxy_pass http://widps_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open for 24 hours max
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable response buffering at OS level
        proxy_set_header X-Accel-Buffering no;
    }

    # --------------------------------------------------------------------------
    # API write endpoints (POST) - stricter rate limit
    # --------------------------------------------------------------------------
    location ~ ^/api/(config|whitelist|alerts/.*/ack|alerts/.*/confirm|intel/.*/(whitelist|blacklist|reset))$ {
        limit_req zone=api_write burst=10 nodelay;

        proxy_pass http://widps_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # API read endpoints (GET) - standard rate limit
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://widps_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Cache short-lived responses
        proxy_cache_valid 200 2s;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA - serve index.html for all non-file routes
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets - aggressive caching (hashed filenames from Vite)
    location ~* ^/assets/.*\.(js|css|woff2?|svg|png|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon and manifest
    location ~* ^/(favicon\.svg|manifest\.json|sw\.js)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Security: block access to hidden files and sensitive paths
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(config|data|src)/ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        text/event-stream;
}
