# WIDPS nginx: TLS termination, static dashboard, /api proxy to 127.0.0.1:8787.
# Certificates: sudo bash deploy/make-local-ca.sh <hostname> (writes /etc/widps/tls/).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/widps && sudo ln -sf /etc/nginx/sites-available/widps /etc/nginx/sites-enabled/widps

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

upstream widps_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

# Plain HTTP only redirects; the session cookie is Secure and never sent here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/widps/tls/server.crt;
    ssl_certificate_key /etc/widps/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WIDPS_TLS:10m;
    ssl_session_tickets off;

    root /opt/widps/dashboard;
    index index.html;

    access_log /var/log/nginx/widps_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/widps_error.log warn;

    client_max_body_size 16K;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # Shared proxy settings; the backend trusts X-Real-IP only from this loopback peer.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;  # keeps the port, so the backend Origin check matches
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    location = /api/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://widps_backend;
        proxy_read_timeout 15s;
    }

    location = /api/stream {
        limit_conn sse_conn 5;
        proxy_pass http://widps_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/api/(config|whitelist|alerts|alerts/.*/ack|alerts/.*/confirm|intel/.*/(whitelist|blacklist|reset)|auth/logout)$ {
        limit_req zone=api_write burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://widps_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://widps_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://widps_backend;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.*\.(js|css|woff2?|svg|png|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(config|data|src)/ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
}
