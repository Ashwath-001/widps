<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Shield body -->
  <path d="M24 4L6 12v12c0 11.1 7.7 21.5 18 24 10.3-2.5 18-12.9 18-24V12L24 4z" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner shield gradient -->
  <path d="M24 8L10 14.5v9.5c0 9 6.3 17.5 14 19.5 7.7-2 14-10.5 14-19.5v-9.5L24 8z" fill="#161b22"/>
  <!-- WiFi arc 1 (outer) -->
  <path d="M14 22c2.7-2.7 6.1-4 10-4s7.3 1.3 10 4" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- WiFi arc 2 (middle) -->
  <path d="M17 25.5c1.8-1.8 4.2-2.8 7-2.8s5.2 1 7 2.8" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <!-- WiFi arc 3 (inner) -->
  <path d="M20 29c1.1-1.1 2.5-1.6 4-1.6s2.9.5 4 1.6" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Center dot -->
  <circle cx="24" cy="32" r="2" fill="#58a6ff"/>
  <!-- Lock overlay (small, bottom-right of shield) -->
  <rect x="30" y="34" width="10" height="8" rx="2" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M33 34v-2a2 2 0 0 1 4 0v2" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Lock keyhole -->
  <circle cx="35" cy="38.5" r="1" fill="#3fb950"/>
</svg>
